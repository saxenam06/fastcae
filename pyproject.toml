[project]
name = "fastcae"
version = "0.1.0"
description = "Interactive implicit geometry and design-space authoring for cast structural parts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "cadquery-ocp==7.9.3.1.1",   # 8.x is unsigned; Smart App Control blocked it. Untested since off
    "trimesh>=4.5",
    "embreex>=2.17",
    "rtree>=1.3",
    "pypdf>=5.1",
    "ortools>=9.15.6755",
    "contourpy>=1.3",            # plate outlines traced from the optimised metal
    "shapely>=2.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "pydantic>=2.9",
]
agent = [
    "langgraph==1.2.11",
    "langchain==1.4.0",
    "langchain-openai==1.6.0",
    "httpx>=0.27",
    "langchain-core==1.6.1",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith==0.12.1",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]
# Reading solver decks and results, tying them to the CAD, writing training records.
simulate = [
    "h5py>=3.12",
    "libigl>=2.6",
    "zarr>=3.0",
    "pyarrow>=18",
    # A CAD meshed face by face, as agenticCAE meshed its designs: its versions, exactly.
    "gmsh==4.15.2",
    "pymeshfix==0.18.1",
]
# The GPU route: the build's distances (Warp), assembly (CuPy), the solve (cuDSS through nvmath).
gpu = [
    "warp-lang>=1.17",
    "cupy-cuda12x[ctk]>=14.2",
    "nvmath-python[cu12]>=1.0",
    "nvidia-cudss-cu12>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastcae"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Code the product no longer runs, kept whole for reference.
extend-exclude = ["_archived_code"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/fastcae"]

[tool.pytest.ini_options]
testpaths = ["tests"]

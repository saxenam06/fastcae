[project]
name = "fastcae"
version = "0.1.0"
description = "Interactive implicit geometry and design-space authoring for cast structural parts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "cadquery-ocp==7.9.3.1.1",   # 8.x is unsigned; Smart App Control blocked it. Untested since off
    "trimesh>=4.5",
    "embreex>=2.17",
    "rtree>=1.3",
    "pypdf>=5.1",
    "ortools>=9.15.6755",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "pydantic>=2.9",
]
agent = [
    "langgraph==1.2.11",
    "langchain==1.4.0",
    "langchain-openai==1.6.0",
    "httpx>=0.27",
    "langchain-core==1.6.1",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith==0.12.1",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
fastcae = "fastcae.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastcae"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/fastcae"]

[tool.pytest.ini_options]
testpaths = ["tests"]
